name: "Release"
on:
  release:
    types: [published]

jobs:
  containerize:
    name: ⚙️ Build Docker containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v3

      - name: Login to GitHub's Container Registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          nix develop -c "docker build -t ghcr.io/szpontniki/docs:${{ github.event.release.tag_name }} ."
          nix develop -c "docker build -t ghcr.io/szpontniki/docs:latest ."

      - name: Push Docker image
        run: |
          nix develop -c "docker push ghcr.io/szpontniki/docs:${{ github.event.release.tag_name }}"
          nix develop -c "docker push ghcr.io/szpontniki/docs:latest"
